# Respeak CI — plan.md 4.1.
#
# Two jobs. `test` is the one that gates a change: the locked environment on 3.12/3.13/3.14, ruff,
# and the offline test suite. `docker` builds the image in a job of its own, so a red image build is
# read as "the image needs work", not as "the code is broken".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref: a second push supersedes the first instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 3.12 failing must not hide what 3.14 does
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # ffmpeg from apt rather than the `static-ffmpeg` pip package: ensure_binaries() only falls
      # back to the packaged binary when PATH has none, so apt keeps the media tests off the
      # network and on one known build. fonts-noto-core (Latin/Cyrillic/Greek/Devanagari) and
      # fonts-noto-cjk are what libass draws burned-in subtitles with — without them those cues
      # render as empty boxes.
      - name: Install ffmpeg and the subtitle fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-cjk

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # --frozen: install exactly uv.lock, never re-resolve. Default groups (dev = pytest + ruff),
      # no extras — `clone` (Chatterbox) is GPU-speed only and its tests skip without it.
      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      # Model weights: faster-whisper and Kokoro live in the huggingface cache, Argos packages in
      # its XDG data dir. ~/.cache/whisper is listed for completeness — it is where an openai-whisper
      # download would land — and is normally empty. A miss downloads a few hundred MB inside the
      # first test that needs them, which is acceptable; a hit makes the run fast. Bump `models-v1`
      # to throw the weights away and fetch them again.
      # The directories are created first so the save step always has every path it was given.
      - name: Create the model cache directories
        run: mkdir -p ~/.cache/huggingface ~/.local/share/argos-translate ~/.cache/whisper

      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/argos-translate
            ~/.cache/whisper
          key: models-v1-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            models-v1-${{ runner.os }}-py${{ matrix.python }}-
            models-v1-${{ runner.os }}-

      # -m "not slow": the slow marker means a model download or the network (pyproject.toml).
      # Everything else runs on the checked-in fixture clip and skips itself when a model it needs
      # is neither cached nor downloadable.
      - name: Tests
        run: uv run pytest -q -p no:warnings -m "not slow"
        timeout-minutes: 40

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: test
    # Not on pull requests: the build is slow and the test matrix is what reviews a change.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64 only. The arm64 half of plan.md 2.5 would have to build under qemu emulation here, and
      # a torch install under emulation does not finish in a sane time; leave it to a real arm host.
      # PREWARM=0 keeps the models out of the image, so this builds the layers, not a gigabyte of
      # weights. push/load false: nothing is published or unpacked, the point is that it builds.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            PREWARM=0
          cache-from: type=gha
          cache-to: type=gha,mode=max
