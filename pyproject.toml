[project]
name = "respeak"
version = "0.1.0.dev0"
description = "Dub any video into another language on your own machine: transcribe, translate, re-voice, subtitle, mux."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Nishant Joshi" }]
keywords = ["dubbing", "translation", "tts", "whisper", "video", "subtitles"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  # web
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  # input
  "yt-dlp[default]>=2025.1",
  "deno>=2.0",
  "static-ffmpeg>=2.5",
  # speech recognition
  "faster-whisper>=1.1",
  # translation
  "argostranslate>=1.9",
  # text-to-speech (default backend)
  "kokoro>=0.9.4",
  "misaki[ja,zh]>=0.9.4",
  "en-core-web-sm",  # spaCy model kokoro/misaki needs for English; wheel URL in [tool.uv.sources]
  "torch>=2.4",
  # media helpers
  "soundfile>=0.12",
  "numpy>=1.26",
  "srt>=3.5",
]

[project.optional-dependencies]
# torchaudio is listed explicitly so it comes from the CPU index like torch (a PyPI torchaudio is a CUDA build)
clone = ["chatterbox-tts>=0.1.7", "torchaudio>=2.4"]

[project.scripts]
respeak = "respeak.cli:main"

[project.urls]
Homepage = "https://github.com/nishantjoshi-007/DubBuddy"
Issues = "https://github.com/nishantjoshi-007/DubBuddy/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]
# chatterbox-tts pins torch==2.6.0 on Python < 3.14 (and leaves it open on 3.14); one torch for everyone instead.
override-dependencies = ["torch>=2.4"]

[tool.uv.sources]
# CPU torch for everyone (uv cannot express "CPU by default, CUDA on request" in one lockfile).
# CUDA users run, after `uv sync`:  uv pip install torch --index-url https://download.pytorch.org/whl/cu128
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["respeak"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the network or a model download"]
